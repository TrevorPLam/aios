# Vale Configuration for AIOS Documentation
# Vale is a prose linter that enforces style rules in documentation

# Minimum version
MinAlertLevel = suggestion

# Paths to check (relative to repository root)
[*.{md,mdx}]
# Applies to all markdown files

# Paths to ignore
[!**/node_modules/**]
[!**/vendor/**]
[!**/dist/**]
[!**/build/**]
[!**/.git/**]

# Style packages to use
# Packages are in .vale/ directory
BasedOnStyles = Vale, write-good

# Vocab files (custom dictionary)
# Add project-specific terms to .vale/Vocab/AIOS/accept.txt
Vocab = AIOS

# Token ignores (regex patterns to skip)
TokenIgnores = \
    (\$[^\$]+\$), \              
    (`[^`]+`), \                
    (https?://[^\s]+), \        
    (```[\s\S]*?```), \        
    (\{[^}]+\}), \              
    (@\w+)                      
